name: Release gates
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'glcad/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release-gates.yml'
      - '.github/workflows/release.yml'
      - 'LICENSE'
      - 'COMMERCIAL-LICENSE.md'
      - 'assets/**'
permissions:
  contents: read
jobs:
  host-and-deliverables:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install ninja glslang flatbuffers molten-vk vulkan-loader bison flex actionlint
      - run: actionlint .github/workflows/release.yml .github/workflows/release-gates.yml
      - run: python -m pip install -r scripts/release-readers-requirements.txt
      - run: cmake --preset debug -DGLCAD_FETCH_SLANG=OFF
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check-release.py --readers-python "$(command -v python)" --output build/release-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-release-evidence
          path: build/release-evidence
  ipad-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake glslang flatbuffers
      - run: scripts/xcode-ios.sh --simulator
      - run: scripts/test-ios-simulator.sh --output build/ios-evidence
      - name: Install verified StoreKit test runtime
        run: xcodebuild -downloadPlatform iOS -buildVersion 26.1 -architectureVariant arm64
      - name: StoreKit purchase and billing lifecycle
        run: |
          store_device=$(xcrun simctl create "GLCAD StoreKit iPad" \
            com.apple.CoreSimulator.SimDeviceType.iPad-A16 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-1)
          scripts/test-ios-simulator.sh --storekit --device "$store_device" \
            --output build/storekit-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-simulator-evidence
          path: |
            build/ios-evidence
            build/storekit-evidence
